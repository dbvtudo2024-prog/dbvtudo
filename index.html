
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DBV Tudo</title>
    <meta name="theme-color" content="#1e40af">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="https://qfpyjavbncijowjvznkg.supabase.co/storage/v1/object/public/App%20DBV%20Tudo/logo%20app.PNG">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.css">
    <script>
      // 1. Process and global polyfills
      window.global = window.global || window;
      window.process = window.process || { env: { NODE_ENV: 'production' } };

      // 2. Disable mobile browser pull-to-refresh on top drag
      (function() {
        var startY = 0;
        window.addEventListener('touchstart', function(e) {
          if (e.touches && e.touches.length === 1) {
            startY = e.touches[0].clientY;
          }
        }, { passive: true });

        window.addEventListener('touchmove', function(e) {
          if (e.touches && e.touches.length === 1) {
            var currentY = e.touches[0].clientY;
            var isDraggingDown = currentY > startY;
            if (isDraggingDown) {
              var target = e.target;
              var scrollableParent = target ? target.closest('.overflow-y-auto, .overflow-auto, .overflow-y-scroll') : null;
              if (!scrollableParent || scrollableParent.scrollTop <= 0) {
                if (e.cancelable) {
                  e.preventDefault();
                }
              }
            }
          }
        }, { passive: false });
      })();

      // 3. Safe Storage Polyfill for Opera, Brave, Safari iframe restrictions
      (function() {
        var isStorageWorking = false;
        try {
          var test = '__dbv_test_storage__';
          window.localStorage.setItem(test, test);
          window.localStorage.removeItem(test);
          isStorageWorking = true;
        } catch (e) {
          isStorageWorking = false;
        }

        if (!isStorageWorking) {
          console.warn('[DBV Tudo] LocalStorage is restricted in this browser environment. Using safe in-memory storage.');
          var mem = {};
          var safeMock = {
            getItem: function(k) { return mem.hasOwnProperty(k) ? mem[k] : null; },
            setItem: function(k, v) { mem[k] = String(v); },
            removeItem: function(k) { delete mem[k]; },
            clear: function() { mem = {}; },
            get length() { return Object.keys(mem).length; },
            key: function(i) { return Object.keys(mem)[i] || null; }
          };
          try {
            Object.defineProperty(window, 'localStorage', { value: safeMock, configurable: true, writable: true });
          } catch(err) {
            window.localStorage = safeMock;
          }
          try {
            Object.defineProperty(window, 'sessionStorage', { value: safeMock, configurable: true, writable: true });
          } catch(err) {
            window.sessionStorage = safeMock;
          }
        }
      })();

      // 3. Safe History API Polyfill for Opera sandboxed iframes
      (function() {
        try {
          var originalPushState = window.history.pushState;
          var originalReplaceState = window.history.replaceState;
          window.history.pushState = function(state, title, url) {
            try {
              return originalPushState.apply(window.history, arguments);
            } catch (e) {
              console.warn('[DBV Tudo] history.pushState suppressed:', e);
            }
          };
          window.history.replaceState = function(state, title, url) {
            try {
              return originalReplaceState.apply(window.history, arguments);
            } catch (e) {
              console.warn('[DBV Tudo] history.replaceState suppressed:', e);
            }
          };
        } catch(e) {}
      })();

      // 4. Safe Service Worker and Cache cleanup
      try {
        if ('serviceWorker' in navigator && navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister().catch(function(){});
            }
          }).catch(function(){});
        }
        if ('caches' in window && window.caches && window.caches.keys) {
          window.caches.keys().then(function(names) {
            for (var j = 0; j < names.length; j++) {
              window.caches.delete(names[j]).catch(function(){});
            }
          }).catch(function(){});
        }
      } catch(e) {}
    </script>
    <style>
        html, body, #root {
            height: 100%;
            width: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            overscroll-behavior-y: none;
            overscroll-behavior-x: none;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-in { animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        .animate-bounce-in { animation: bounceIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
